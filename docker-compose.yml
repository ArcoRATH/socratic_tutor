services:
  db:
    image: pgvector/pgvector:pg16
    container_name: socratic_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: socratic_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: socratic_app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    # Overriding the DB URL to use the container name 'db' instead of 'localhost'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/socratic_db
    stdin_open: true
    tty: true

volumes:
  postgres_data: